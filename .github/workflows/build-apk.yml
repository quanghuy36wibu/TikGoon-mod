name: Build TikGoon APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'libs/**'
      - 'res/**'
      - 'assets/**'
      - 'AndroidManifest.xml'
      - 'build.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses <<< $'y\ny\ny\ny\ny\ny\ny\n' > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Build APK
        run: python build.py
        env:
          TIKGOON_RELEASE: ${{ secrets.TIKGOON_KEYSTORE_BASE64 != '' && secrets.TIKGOON_KEYSTORE_PASSWORD != '' && secrets.TIKGOON_KEY_ALIAS != '' && secrets.TIKGOON_KEY_PASSWORD != '' && '1' || '0' }}
          TIKGOON_KEYSTORE_BASE64: ${{ secrets.TIKGOON_KEYSTORE_BASE64 }}
          TIKGOON_KEYSTORE_PASSWORD: ${{ secrets.TIKGOON_KEYSTORE_PASSWORD }}
          TIKGOON_KEY_ALIAS: ${{ secrets.TIKGOON_KEY_ALIAS }}
          TIKGOON_KEY_PASSWORD: ${{ secrets.TIKGOON_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikGoon-${{ github.run_number }}
          path: build/TikGoon-*.apk
          if-no-files-found: error
          retention-days: 30
