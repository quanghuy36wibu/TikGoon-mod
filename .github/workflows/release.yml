name: Build and release TikGoon

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import os,xml.etree.ElementTree as ET; manifest=ET.parse('AndroidManifest.xml').getroot(); version=manifest.attrib['{http://schemas.android.com/apk/res/android}versionName']; assert os.environ['GITHUB_REF_NAME']=='v'+version, 'Tag must match AndroidManifest.xml versionName'"
      - name: Build test APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python build.py
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TIKGOON_RELEASE: '1'
          TIKGOON_KEYSTORE_BASE64: ${{ secrets.TIKGOON_KEYSTORE_BASE64 }}
          TIKGOON_KEYSTORE_PASSWORD: ${{ secrets.TIKGOON_KEYSTORE_PASSWORD }}
          TIKGOON_KEY_ALIAS: ${{ secrets.TIKGOON_KEY_ALIAS }}
          TIKGOON_KEY_PASSWORD: ${{ secrets.TIKGOON_KEY_PASSWORD }}
        run: python build.py
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "build/TikGoon-$env:GITHUB_REF_NAME.apk" "build/TikGoon-$env:GITHUB_REF_NAME.apk.sha256" --verify-tag --title "TikGoon $env:GITHUB_REF_NAME" --generate-notes
