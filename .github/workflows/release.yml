name: Build and release TikGoon

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -c "
          import os, xml.etree.ElementTree as ET
          manifest = ET.parse('AndroidManifest.xml').getroot()
          version = manifest.attrib['{http://schemas.android.com/apk/res/android}versionName']
          tag = os.environ['GITHUB_REF_NAME']
          assert tag == 'v' + version, f'Tag {tag!r} must match versionName v{version} in AndroidManifest.xml'
          print(f'OK: {tag} == v{version}')
          "

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python build.py

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: TikGoon-debug-${{ github.run_number }}
          path: build/TikGoon-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TIKGOON_RELEASE: '1'
          TIKGOON_KEYSTORE_BASE64: ""
          TIKGOON_KEYSTORE_PASSWORD: "12345678"
          TIKGOON_KEY_ALIAS: "tikgoon"
          TIKGOON_KEY_PASSWORD: "12345678"
        run: python build.py

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             "build/TikGoon-${GITHUB_REF_NAME}.apk"             "build/TikGoon-${GITHUB_REF_NAME}.apk.sha256"             --verify-tag             --title "TikGoon ${GITHUB_REF_NAME}"             --generate-notes
