name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tên tag/phiên bản (ví dụ v0.8.7)'
        required: true
        type: string

permissions:
  contents: write

env:
  SIGNED: ${{ secrets.TIKGOON_KEYSTORE_BASE64 != '' && secrets.TIKGOON_KEYSTORE_PASSWORD != '' && secrets.TIKGOON_KEY_ALIAS != '' && secrets.TIKGOON_KEY_PASSWORD != '' && '1' || '0' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses <<< $'y\ny\ny\ny\ny\ny\ny\n' > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Build APK
        run: python build.py
        env:
          TIKGOON_RELEASE: ${{ env.SIGNED }}
          TIKGOON_KEYSTORE_BASE64: ${{ secrets.TIKGOON_KEYSTORE_BASE64 }}
          TIKGOON_KEYSTORE_PASSWORD: ${{ secrets.TIKGOON_KEYSTORE_PASSWORD }}
          TIKGOON_KEY_ALIAS: ${{ secrets.TIKGOON_KEY_ALIAS }}
          TIKGOON_KEY_PASSWORD: ${{ secrets.TIKGOON_KEY_PASSWORD }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: TikGoon ${{ github.event.inputs.tag || github.ref_name }}
          files: build/TikGoon-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ env.SIGNED != '1' }}
          body: |
            Module LSPosed cho TikTok 47.0.3 (`com.ss.android.ugc.trill`).
            ${{ env.SIGNED == '1' && 'APK ký bằng khóa cố định: cài đè được bản cũ.' || 'APK ký bằng khóa debug: gỡ bản cũ trước khi cài.' }}
